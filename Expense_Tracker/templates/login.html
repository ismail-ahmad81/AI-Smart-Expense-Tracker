<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modern Login / Sign Up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b1325; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .container { background-color: #0d1b2a; border-radius: 12px; box-shadow: 0 14px 28px rgba(0,0,0,0.5); position: relative; overflow: hidden; width: 768px; max-width: 100%; min-height: 480px; }
        .form-container { position: absolute; top: 0; height: 100%; transition: all 0.6s ease-in-out; }
        
        .sign-in-container { left: 0; width: 50%; z-index: 2; }
        .container.right-panel-active .sign-in-container { transform: translateX(100%); }
        
        .sign-up-container { left: 0; width: 50%; opacity: 0; z-index: 1; }
        .container.right-panel-active .sign-up-container { transform: translateX(100%); opacity: 1; z-index: 5; animation: show 0.6s; }
        
        @keyframes show { 0%, 49.99% { opacity: 0; z-index: 1; } 50%, 100% { opacity: 1; z-index: 5; } }
        
        form { background: #0d1b2a; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 50px; height: 100%; text-align: center; color: white; }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .input-group { position: relative; width: 100%; margin: 8px 0; }
        input { background-color: #1b263b; border: 1px solid #415a77; padding: 12px 15px; border-radius: 6px; width: 100%; color: white; outline: none; }
        
        button { border-radius: 6px; border: 1px solid #00b4d8; background-color: #00b4d8; color: #FFFFFF; font-size: 14px; font-weight: bold; padding: 12px 45px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: transform 80ms ease-in; margin-top: 15px; }
        button:active { transform: scale(0.95); }
        button.ghost { background-color: transparent; border-color: #FFFFFF; }
        
        .overlay-container { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; overflow: hidden; transition: transform 0.6s ease-in-out; z-index: 100; }
        .container.right-panel-active .overlay-container { transform: translateX(-100%); }
        
        .overlay { background: linear-gradient(135deg, #0077b6, #03045e); color: #FFFFFF; position: relative; left: -100%; height: 100%; width: 200%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .container.right-panel-active .overlay { transform: translateX(50%); }
        
        .overlay-panel { position: absolute; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 0 40px; text-align: center; top: 0; height: 100%; width: 50%; transform: translateX(0); transition: transform 0.6s ease-in-out; }
        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }
        
        p { font-size: 14px; font-weight: 300; line-height: 20px; margin: 20px 0 30px; }
        a { color: #00b4d8; text-decoration: none; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container" id="container">
    
    <div class="form-container sign-up-container">
        <form onsubmit="handleSignUp(event)">
            <h1>Sign Up</h1>
            <div class="input-group"><input type="text" id="reg-name" placeholder="Username" required /></div>
            <div class="input-group"><input type="email" id="reg-email" placeholder="Email" required /></div>
            <div class="input-group"><input type="password" id="reg-password" placeholder="Password" required /></div>
            <button type="submit">Register</button>
        </form>
    </div>

   
    <div class="form-container sign-in-container">
        <form onsubmit="handleLogin(event)">
            <h1>Login</h1>
            <div class="input-group"><input type="email" id="login-email" placeholder="Email" required /></div>
            <div class="input-group"><input type="password" id="login-password" placeholder="Password" required /></div>
            <button type="submit">Login</button>
        </form>
    </div>

   
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>WELCOME!</h1>
                <p>Hope, You and your Family have a Great Day</p>
                <button class="ghost" id="signIn">Login</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>WELCOME BACK!</h1>
                <p>Hope, You and your Family have a Great Day</p>
                <button class="ghost" id="signUp">Sign Up</button>
            </div>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('container');

    document.getElementById('signUp').addEventListener('click', () => {
        container.classList.add("right-panel-active");
    });

    document.getElementById('signIn').addEventListener('click', () => {
        container.classList.remove("right-panel-active");
    });

    
    async function handleSignUp(event) {
        event.preventDefault();
        
        const data = {
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value
        };

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (res.ok) {
                alert("Account Created Successfully! Ab Login karein.");
                container.classList.remove("right-panel-active");
            } else {
                alert("Registration Error: " + (result.error || "Failed"));
            }
        } catch (err) {
            alert("Connection Failed!");
        }
    }

    async function handleLogin(event) {
        event.preventDefault();
        
        const data = {
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
        };

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (res.ok) {
                window.location.href = result.redirect;
            } else {
                alert("Login Error: " + (result.error || "Invalid Credentials"));
            }
        } catch (err) {
            alert("Connection Failed!");
        }
    }
</script>

</body>
</html>
